version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: restaurants_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: restaurants
    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurants"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: restaurants_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/restaurants
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
