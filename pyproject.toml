[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurantscatalog"
version = "0.1.0"
description = "Backend catalog MVP for Restaurants Catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "geoalchemy2>=0.20.0",
]
